name: Growth loop

# Daily: research the market, propose what is worth building, and fix the parts
# that are mechanical — in that order, and with a fence around the last one.
#
#   1. RESEARCH  scripts/market.js reads the READMEs of six comparable
#                assistants and diffs them against docs/CAPABILITIES.json.
#                Facts come from endpoints; nothing here is a model's memory.
#   2. PROPOSE   scripts/growth.js files up to a quota of issues. The quota is
#                earned: one per day to start, one more for every two proposals
#                a human has actually merged, capped at five.
#   3. FIX       scripts/manager.js repairs the mechanical classes — an
#                undocumented variable, a broken relative link — inside a fence
#                that cannot reach src/. It runs the full suite and the audit,
#                and opens ONE pull request. A human merges it.
#
# What this job cannot do, by construction: push to main, merge anything, or
# edit any file outside the allowlist in scripts/manager.js.

on:
  schedule:
    - cron: "41 5 * * *" # daily, 05:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report decisions without filing, commenting, or pushing"
        type: boolean
        default: false
      skip_fix:
        description: "Propose only — do not open a fix PR today"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: growth-loop
  cancel-in-progress: false

jobs:
  grow:
    name: Research, propose, fix
    runs-on: ubuntu-latest
    permissions:
      contents: write # for the fix branch only; main is protected
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Has the maintainer paused the loop?
        id: pause
        run: |
          if [ -f .github/growth-pause ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            cat .github/growth-pause
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 1. research ────────────────────────────────────────────────────────
      - name: Research the comparison set
        if: steps.pause.outputs.paused == 'false'
        run: |
          set -euo pipefail
          # A researcher that cannot reach the network is a hole in the
          # comparison, not a reason to skip the day: --offline reuses the last
          # snapshot and says so.
          node scripts/market.js --json > /tmp/market.json || {
            echo "::warning::market research failed, falling back to the cached snapshot"
            node scripts/market.js --offline --json > /tmp/market.json
          }
          jq -r '"\(.gaps | length) gap(s) across \(.sources | map(select(.ok != false)) | length) sources"' /tmp/market.json

      # ── 2. propose, at the earned rate ────────────────────────────────────
      - name: How fast is the loop allowed to go?
        id: rate
        if: steps.pause.outputs.paused == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Trust is earned by merges, not assumed. `--state merged` counts only
          # bot proposals a human accepted; a closed-without-merge one does not
          # increase the rate.
          MERGED="$(gh pr list --state merged --label growth --limit 100 --json number --jq 'length')"
          echo "merged=$MERGED" >> "$GITHUB_OUTPUT"

          # Collect the whole backlog — closed issues included, because a
          # proposal declined last month should not be re-filed tomorrow.
          gh issue list --state all --limit 300 \
            --json number,title,state,body,labels,comments,updatedAt,createdAt \
            > /tmp/issues.json

          OPEN_PRS="$(gh pr list --state open --label growth --limit 10 --json number --jq 'length')"
          echo "open_prs=$OPEN_PRS" >> "$GITHUB_OUTPUT"
          # One fix in flight at a time: two bot PRs is a review queue, not a loop.
          if [ "$OPEN_PRS" -gt 0 ]; then echo "fix_blocked=true" >> "$GITHUB_OUTPUT"; else echo "fix_blocked=false" >> "$GITHUB_OUTPUT"; fi

      - name: Decide what to propose
        id: decide
        if: steps.pause.outputs.paused == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/growth.js --existing /tmp/issues.json --market /tmp/market.json \
            --merged "${{ steps.rate.outputs.merged }}" --json > /tmp/decision.json
          DECISION="$(jq -r .decision /tmp/decision.json)"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          {
            echo "### 🦞 Growth loop — $DECISION"
            echo
            echo "**$(jq -r .reason /tmp/decision.json)**"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Quota | $(jq -r .quota /tmp/decision.json) (from $(jq -r .merged /tmp/decision.json) merged) |"
            echo "| Market | $(jq -r .market /tmp/decision.json) |"
            echo
            jq -r '.files[]? | "- **filed:** \(.title)"' /tmp/decision.json
            jq -r '.annotates[]? | "- **commented on #\(.issue)**"' /tmp/decision.json
            jq -r '.ranked[0:6][]? | "- \(.score) — \(.title)"' /tmp/decision.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: File the proposals
        if: steps.decide.outputs.decision == 'file' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create growth --description "Proposed by the daily growth loop" --color "c77dff" 2>/dev/null || true
          COUNT="$(jq '.files | length' /tmp/decision.json)"
          for i in $(seq 0 $((COUNT - 1))); do
            jq -r ".files[$i].title" /tmp/decision.json > /tmp/title.txt
            jq -r ".files[$i].markdown" /tmp/decision.json > /tmp/body-$i.md
            gh issue create --title "$(cat /tmp/title.txt)" --body-file "/tmp/body-$i.md" --label growth
          done
          echo "filed $COUNT proposal(s)" >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate requests humans already made
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT="$(jq '.annotates | length' /tmp/decision.json)"
          for i in $(seq 0 $((COUNT - 1))); do
            NUMBER="$(jq -r ".annotates[$i].issue" /tmp/decision.json)"
            jq -r ".annotates[$i].markdown" /tmp/decision.json > /tmp/comment-$i.md
            gh issue comment "$NUMBER" --body-file "/tmp/comment-$i.md" \
              || echo "::warning::could not comment on #$NUMBER"
          done

      # ── 3. fix what is mechanical, inside the fence ───────────────────────
      - name: Fix one mechanical issue and open a pull request
        if: |
          steps.pause.outputs.paused == 'false' &&
          steps.rate.outputs.fix_blocked == 'false' &&
          inputs.dry_run != true &&
          inputs.skip_fix != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Refresh the backlog: the proposals filed above may themselves be
          # mechanical, and there is no reason for them to wait a day.
          gh issue list --state open --label growth --limit 50 \
            --json number,title,state,body,labels,comments,createdAt > /tmp/fixable.json

          node scripts/manager.js --issues /tmp/fixable.json --apply --json > /tmp/manager.json
          APPLIED="$(jq -r '.applied.issue // empty' /tmp/manager.json)"
          cat /tmp/manager.json | jq -r '.reports[] | "  \(if .verified then "fixed" else "left alone" end): #\(.issue) \(.reason // .summary)"'

          if [ -z "$APPLIED" ]; then
            echo "no mechanical fix today" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          SUMMARY="$(jq -r '.applied.summary' /tmp/manager.json)"
          BRANCH="growth/fix-${APPLIED}-$(date -u +%Y%m%d)"
          git config user.name "pinch-growth[bot]"
          git config user.email "growth@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          {
            echo "fix(#${APPLIED}): ${SUMMARY}"
            echo
            echo "Applied by scripts/manager.js, which may edit documentation and"
            echo ".env.example and nothing else. node --test and node"
            echo "scripts/audit.js both pass on this commit; had either failed, the"
            echo "tree would have been restored and this branch would not exist."
            echo
            echo "Closes #${APPLIED}."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt

          # Push with the token in the URL only for this one command, never in
          # the checkout's config (persist-credentials: false above).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          BODY="$(printf '%s\n' \
            "Automated fix for #${APPLIED}." \
            "" \
            "**What changed:** ${SUMMARY}" \
            "" \
            "**Why this is safe to merge unattended:**" \
            "- the edit is inside the manager's fence — documentation and \`.env.example\`, never \`src/\`" \
            "- \`node --test\` and \`node scripts/audit.js\` were run against this exact tree, and the fix would have been reverted otherwise" \
            "- one fix per PR, so the diff is readable in a minute" \
            "" \
            "**What it does not touch:** the approval gate, the command screen, the workspace sandbox, or anything else in \`docs/AUDIT.md\`.")"

          gh pr create --title "fix(#${APPLIED}): ${SUMMARY}" --body "$BODY" --label growth --base main --head "$BRANCH"
          echo "opened a fix PR for #${APPLIED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the artefacts
        if: always() && steps.pause.outputs.paused == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: growth-${{ github.run_id }}
          path: |
            /tmp/decision.json
            /tmp/market.json
            /tmp/manager.json
            /tmp/issues.json
          retention-days: 30
