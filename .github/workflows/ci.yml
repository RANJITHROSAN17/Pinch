name: CI

# Two jobs: the unit/agent tests, and a boot smoke test that starts the whole
# server with the mock brain and talks to it over HTTP. The smoke test matters
# more than it looks — it proves the panel, the SSE stream and the approval
# endpoint work on a clean machine with no model installed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and agent tests
        run: npm test

      # These two files are the regression suite for docs/AUDIT.md. They run as
      # part of `npm test` too; naming them separately means a failure points
      # straight at the finding it protects.
      - name: Security regressions from the audit
        run: node --test test/audit.test.js test/http-surface.test.js

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Boot with the mock brain
        env:
          LLM_PROVIDER: mock
          PINCH_KEY: ""
          PINCH_PORT: "7777"
          PINCH_WORKSPACE: ${{ github.workspace }}
        run: |
          node src/index.js > /tmp/pinch.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:7777/api/health > /dev/null && break
            sleep 1
          done
          cat /tmp/pinch.log

      - name: Panel is served
        run: curl -sf http://localhost:7777/ | grep -q "Pinch"

      - name: Health endpoint reports a brain
        run: |
          curl -sf http://localhost:7777/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

      - name: Agent runs a tool end to end over SSE
        run: |
          curl -sN -X POST http://localhost:7777/api/chat \
            -H 'content-type: application/json' \
            -d '{"sessionId":"ci","text":"calc (1200*1.18)/3"}' > /tmp/sse.txt
          cat /tmp/sse.txt
          grep -q "calculator" /tmp/sse.txt
          grep -q "472" /tmp/sse.txt
          grep -q "event: final" /tmp/sse.txt

      - name: Streaming deltas arrive before the final answer
        run: |
          curl -sN -X POST http://localhost:7777/api/chat \
            -H 'content-type: application/json' \
            -d '{"sessionId":"ci-stream","text":"hello"}' > /tmp/sse3.txt
          grep -q '"type":"delta"' /tmp/sse3.txt
          echo "deltas: $(grep -c '"type":"delta"' /tmp/sse3.txt)"

      - name: Reminders round-trip through the API and the scheduler
        run: |
          curl -sN -X POST http://localhost:7777/api/chat \
            -H 'content-type: application/json' \
            -d '{"sessionId":"ci-rem","text":"remind me in 45 minutes to stretch"}' > /tmp/sse4.txt
          curl -sf http://localhost:7777/api/reminders > /tmp/rem.json
          cat /tmp/rem.json
          grep -q '"text":"stretch"' /tmp/rem.json
          # rewind it into the past and let the 15s tick fire it
          node -e "
            const fs = require('fs');
            const p = 'data/reminders.json';
            const list = JSON.parse(fs.readFileSync(p, 'utf8'));
            list.forEach(r => r.at = new Date(Date.now() - 120000).toISOString());
            fs.writeFileSync(p, JSON.stringify(list, null, 2));
          "
          sleep 20
          grep -q '"fired": true' data/reminders.json
          echo "reminder fired on schedule"

      - name: Honesty guard flags a claim with no evidence
        run: |
          node --input-type=module -e "
            import { auditReply } from './src/guard.js';
            const r = auditReply({ reply: \"I've sent it to boss@corp.com\", trace: [], userText: 'email my boss' });
            if (r.clean) { console.error('guard failed to flag an unsupported claim'); process.exit(1); }
            console.log('flagged:', r.flags.map(f => f.code).join(', '));
          "

      - name: A denied command must not run
        run: |
          curl -sN -X POST http://localhost:7777/api/chat \
            -H 'content-type: application/json' \
            -d '{"sessionId":"ci-deny","text":"run touch SHOULD_NOT_EXIST"}' > /tmp/sse2.txt &
          sleep 3
          ID=$(grep -o '"id":"ap_[^"]*"' /tmp/sse2.txt | head -1 | cut -d'"' -f4)
          test -n "$ID"
          curl -sf -X POST http://localhost:7777/api/approve \
            -H 'content-type: application/json' \
            -d "{\"id\":\"$ID\",\"allowed\":false}"
          sleep 2
          test ! -f SHOULD_NOT_EXIST
          echo "denied command correctly did not execute"

      - name: A foreign Origin and a forged Host are refused
        run: |
          code=$(curl -s -o /tmp/origin.json -w '%{http_code}' -X POST http://localhost:7777/api/chat \
            -H 'Origin: https://evil.example' -H 'content-type: application/json' -d '{"text":"hi"}')
          cat /tmp/origin.json; echo
          test "$code" = "403" || { echo "cross-site request was not refused ($code)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7777/api/health -H 'Host: attacker.example')
          test "$code" = "403" || { echo "DNS-rebinding host was not refused ($code)"; exit 1; }
          echo "origin and host checks hold"

      - name: A symlink cannot walk out of the workspace
        run: |
          mkdir -p /tmp/pinch-ws-trap && ln -sfn /etc /tmp/pinch-ws-trap/escape
          PINCH_WORKSPACE=/tmp/pinch-ws-trap node --input-type=module -e "
            import { resolveInWorkspace, SafePathError } from './src/tools.js';
            try {
              console.log('allowed:', resolveInWorkspace('escape/passwd'));
              console.error('sandbox escaped through a symlink'); process.exit(1);
            } catch (err) {
              if (!(err instanceof SafePathError)) throw err;
              console.log('refused:', err.message.slice(0, 80));
            }
          "

      - name: A shell command cannot read the assistant's secrets
        env:
          PINCH_KEY: ci-secret-do-not-leak
          TELEGRAM_TOKEN: 424242:ci-fake-token
        run: |
          node --input-type=module -e "
            import { runShell } from './src/tools.js';
            const r = await runShell('printenv PINCH_KEY TELEGRAM_TOKEN || echo absent');
            console.log('child saw:', r.stdout.trim());
            if (/ci-secret-do-not-leak|ci-fake-token/.test(r.stdout)) {
              console.error('a credential reached the child process'); process.exit(1);
            }
          "

      - name: No secrets committed
        run: |
          if git ls-files | grep -qx ".env"; then echo ".env must never be committed"; exit 1; fi
          if git ls-files | grep -q "^data/"; then echo "data/ holds conversations; keep it out"; exit 1; fi
          echo "tree is clean of secrets and personal data"
