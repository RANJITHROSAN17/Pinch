name: Deploy landing page

# GitHub Pages is configured with build_type "workflow", which means nothing deploys until a
# workflow actually does it. There wasn't one, so https://ranjithrosan17.github.io/Pinch/ has
# been serving a 404 since it was enabled.
#
# This publishes site/ and nothing else. The application itself is never deployed — Pinch is
# a program you run on your own machine, and putting a personal assistant on a public URL
# would be the opposite of the point.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Every action below is pinned to a 40-char commit SHA, not a tag: test/roadmap.test.js
# enforces this repo-wide for OpenSSF Scorecard, and a moving tag is how a build starts
# running code nobody reviewed.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the page before publishing it
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "site/index.html is missing"; exit 1; }
          # A landing page with no title or description is invisible to search engines, which
          # is the entire purpose of this file existing.
          grep -q "<title>" site/index.html || { echo "no <title>"; exit 1; }
          grep -q 'name="description"' site/index.html || { echo "no meta description"; exit 1; }
          grep -q "application/ld+json" site/index.html || { echo "no structured data"; exit 1; }
          echo "landing page checks passed"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
